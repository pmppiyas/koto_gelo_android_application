name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g. v1.0.0, v1.0.1)
  workflow_dispatch: # Allow manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Prebuild Android Project
        run: npx expo prebuild --platform android --clean

      - name: 🔨 Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: 🏷️ Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.0-$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.TAG_NAME }}
          name: KotoGelo ${{ steps.release_tag.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/release/app-release.apk
          body: |
            ## 📱 KotoGelo Android Release (${{ steps.release_tag.outputs.TAG_NAME }})
            
            Download the official direct Android APK below to install on your Android device.
            
            ### ✨ Features & Updates:
            - Smart daily personal expense tracking
            - Offline-first SQLite local persistence
            - Mess & tour group split bill management
            - Real-time cloud sync with zero ads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
